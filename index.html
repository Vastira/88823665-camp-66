<!DOCTYPE html>
<html>

<head>
    <title>HTML FORM</title>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="mystyle.css">
    <link href="css/bootstrap.min.css" rel="stylesheet" />
    <script src="js/bootstrap.min.js"></script>
</head>

<body>
    <div class="container mt-3">
        <form>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="firstName" class="form-label">ชื่อ
                        <span style="color:red;">*</span></label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="firstName" name="firstName" placeholder="ชื่อ">
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="lastName" class="form-label">สกุล</label>
                </div>
                <div class="col">
                    <input type="text" class="form-control" id="lastName" name="lastName">
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="birthDate" class="form-label">วัน/เดือน/ปีเกิด</label>
                </div>
                <div class="col">
                    <input type="date" class="form-control" id="birthDate" name="birthDate">
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="age" class="form-label">อายุ</label>
                </div>
                <div class="col">
                    <input type="number" class="form-control" id="age" name="age">
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="gender" class="form-label">เพศ</label>
                </div>
                <div class="col">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="male">
                        <label class="form-check-label" for="male">ชาย</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="gender" id="female">
                        <label class="form-check-label" for="female">หญิง</label>
                    </div>
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="picture" class="form-label">รูป</label>
                </div>
                <div class="col">
                    <input type="file" class="form-control" id="picture" name="picture">
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="address" class="form-label">ที่อยู่</label>
                </div>
                <div class="col">
                    <textarea rows="6" cols="25" class="form-control" id="address" name="address"></textarea>
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="favColor" class="form-label">สีที่ชอบ</label>
                </div>
                <div class="col">
                    <select size="1" class="form-control" id="favColor" name="favColor">
                        <option value="red">สีแดง</option>
                        <option value="yellow">สีเหลือง</option>
                        <option value="green">สีเขียว</option>
                        <option value="blue">สีน้ำเงิน</option>
                        <option value="none">ไม่มี</option>
                    </select>
                </div>
            </div>
            <div class="mb-3 row">
                <div class="col-4">
                    <label for="favMusic" class="form-label">แนวเพลงที่ชอบ</label>
                </div>
                <div class="col">
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="favMusic" id="forLife">
                        <label class="form-check-label" for="forLife">เพื่อชีวิต</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="favMusic" id="country">
                        <label class="form-check-label" for="country">ลูกทุ่ง</label>
                    </div>
                    <div class="form-check">
                        <input class="form-check-input" type="radio" name="favMusic" id="other">
                        <label class="form-check-label" for="other">อื่นๆ</label>
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="col-4">
                        <input type="checkbox" class="form-check-input" name="agreement" value="agree">
                        <label for="agreement" id="agreement-label">ยินยอมให้เก็บข้อมูล</label>
                    </div>
                </div>
                <div class="mb-3 row">
                    <div class="col-4">
                        <button type="reset" class="btn btn-secondary">Reset</button>
                    </div>
                    <div class="col text-end">
                        <button type="submit" class="btn btn-success">Submit</button>
                    </div>
                </div>
        </form>
    </div>
</body>

</html>
